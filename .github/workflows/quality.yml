name: Quality

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check .

      - name: Check formatting
        run: |
          black --check .

      - name: Run tests
        run: |
          pytest

      - name: Run coverage
        run: |
          coverage run -m pytest
          coverage report -m

      - name: Run pre-commit
        run: |
          pre-commit run --all-files
