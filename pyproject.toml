[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-foundation"
version = "0.1.0"
description = "Python project foundation"
readme = "README.md"
requires-python = ">=3.11"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "MossKW" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "coverage[toml]",
    "build",
    "ruff",
    "black",
    "pre-commit",
]

[project.scripts]
dev-foundation = "dev_foundation.__main__:main"

[project.entry-points."dev_foundation.commands"]
version = "dev_foundation.commands.version:VersionCommand"
doctor = "dev_foundation.commands.doctor:DoctorCommand"
init = "dev_foundation.commands.init:InitCommand"

[project.entry-points."dev_foundation.blueprints"]
python = "dev_foundation.blueprint:PythonBlueprint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_foundation = [
    "templates/*",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["dev_foundation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
